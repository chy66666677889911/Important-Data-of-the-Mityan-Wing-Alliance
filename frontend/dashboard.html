<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>弥天翼航空联盟 - 大厅</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app">
        <!-- 左侧按钮列 -->
        <div class="sidebar">
            <div class="sidebar-logo">🟢 弥天翼</div>
            <button onclick="showSection('lobby')" class="active">🏠 大厅</button>
            <button onclick="showSection('events')">✈️ 连飞活动</button>
            <button onclick="showSection('metar')">🌤️ 机场METAR</button>
            <button onclick="showSection('route')">🗺️ 航路查询</button>
            <button onclick="showSection('apply')">📋 职员申请</button>
            <button onclick="logout()" class="logout-btn">🚪 退出</button>
        </div>

        <!-- 右侧内容区 -->
        <div class="content">
            <!-- 大厅 -->
            <div id="lobby" class="section active">
                <div class="lobby-header">
                    <h2>欢迎飞行员，<span id="pilotName" style="color:#2ecc71;"></span></h2>
                    <div class="weather-inline">
                        🌤️ <span id="weather">加载中...</span>
                    </div>
                </div>
                <div class="lobby-grid">
                    <div class="card">
                        <h3>📍 附近机场</h3>
                        <p id="nearbyAirports">加载中...</p>
                    </div>
                    <div class="card">
                        <h3>💬 聊天室</h3>
                        <div id="chatMessages" class="chat-messages">
                            <p style="color:#999;">聊天室功能即将上线</p>
                        </div>
                    </div>
                    <div class="card">
                        <div class="online-box">
                            🟢 在线人数：<span id="onlineCount">0</span>
                        </div>
                    </div>
                    <div class="card">
                        <h3>📢 系统公告</h3>
                        <div id="announcements">
                            <p style="color:#999;">暂无公告</p>
                        </div>
                        <div id="adminAnnounce" style="display:none; margin-top:10px;">
                            <input type="text" id="announceText" placeholder="输入公告内容" style="width:70%;padding:8px;">
                            <button onclick="postAnnouncement()" style="padding:8px 15px;background:#2ecc71;border:none;border-radius:5px;color:white;cursor:pointer;">发布</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 连飞活动 -->
            <div id="events" class="section">
                <h2>✈️ 连飞活动</h2>
                <div id="eventList">
                    <p style="color:#999;">加载中...</p>
                </div>
            </div>

            <!-- METAR -->
            <div id="metar" class="section">
                <h2>🌤️ 机场 METAR 报</h2>
                <p style="color:#666;margin-bottom:10px;">输入机场 ICAO 代码查询实时天气报文</p>
                <div class="query-row">
                    <input type="text" id="icaoMetar" placeholder="机场ICAO代码（如 ZGGG）" maxlength="4" style="text-transform:uppercase;">
                    <button onclick="getMetar()">查询</button>
                </div>
                <div class="result-box">
                    <pre id="metarResult">等待查询...</pre>
                </div>
            </div>

            <!-- 航路 -->
            <div id="route" class="section">
                <h2>🗺️ 航路查询</h2>
                <p style="color:#666;margin-bottom:10px;">输入起降机场 ICAO 代码查询航路</p>
                <div class="query-row">
                    <input type="text" id="dep" placeholder="起飞机场（如 ZGGG）" maxlength="4" style="text-transform:uppercase;">
                    <input type="text" id="arr" placeholder="降落机场（如 RJTT）" maxlength="4" style="text-transform:uppercase;">
                    <button onclick="getRoute()">查询</button>
                </div>
                <div class="result-box">
                    <pre id="routeResult">等待查询...</pre>
                </div>
            </div>

            <!-- 职员申请 -->
            <div id="apply" class="section">
                <h2>📋 职员申请</h2>
                <form id="applyForm">
                    <div class="form-group">
                        <label>申请职位</label>
                        <select id="position">
                            <option value="atc">空管（ATC）</option>
                            <option value="event">活动策划</option>
                            <option value="staff">联盟工作人员</option>
                            <option value="admin">管理员助理</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>你为什么要申请？</label>
                        <textarea id="reason" placeholder="请详细描述你的经验和原因..." rows="5" required></textarea>
                    </div>
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="loyalty" required> 我愿意效忠弥天翼航空联盟
                        </label>
                    </div>
                    <button type="submit" class="submit-btn">提交申请</button>
                </form>
            </div>
        </div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
