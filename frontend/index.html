<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>弥天翼航空联盟 - 登录</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1 style="color: #2ecc71;">🟢 弥天翼航空联盟</h1>
        </div>
        <form id="loginForm">
            <input type="text" id="username" placeholder="四位数字ID（如1001）" maxlength="4" required>
            <input type="password" id="password" placeholder="密码" required>
            <label class="remember">
                <input type="checkbox" id="remember"> 记住我
            </label>
            <button type="submit">登录</button>
        </form>
        <p class="switch">没有账号？<a href="register.html">去注册</a></p>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
