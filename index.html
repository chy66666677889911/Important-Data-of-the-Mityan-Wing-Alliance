<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>弥天翼航空联盟</title>
<style>
:root{--bg:#0b1120;--card:#131a2c;--border:#1e293b;--primary:#3b82f6;--green:#22d3ee;--text:#f1f5f9;--muted:#94a3b8;--danger:#ef4444}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:1100px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px}
.input{width:100%;padding:10px;margin-bottom:12px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,0.05);color:var(--text)}
.btn{background:linear-gradient(90deg,var(--primary),var(--green));color:#0b1120;padding:10px 16px;border:none;border-radius:8px;font-weight:600;cursor:pointer}
.btn:hover{opacity:.9}
.btn-danger{background:var(--danger)}
.hidden{display:none!important}
.flex{display:flex;gap:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:9999}
.modal-box{background:var(--card);padding:24px;width:400px;border-radius:12px;border:1px solid var(--border)}
.nav{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto}
.nav-btn{padding:8px 16px;border-radius:9999px;background:var(--card);border:1px solid var(--border);color:var(--muted);cursor:pointer;white-space:nowrap}
.nav-btn.active{background:var(--primary);color:#0b1120;border-color:var(--primary)}
</style>
</head>
<body>
<div class="container">
<div id="authOverlay" class="modal">
<div class="modal-box">
<h2 style="color:var(--green);margin-bottom:16px;text-align:center">✈️ 弥天翼航空联盟</h2>
<div id="loginBox">
<input id="loginUser" class="input" placeholder="4位数字ID">
<input id="loginPass" class="input" type="password" placeholder="密码">
<button class="btn" style="width:100%" onclick="fakeLogin()">登 录</button>
<p style="margin-top:14px;text-align:center;font-size:13px;color:var(--muted);cursor:pointer" onclick="showRegister()">没有账号？立即注册</p>
</div>
<div id="registerBox" class="hidden">
<input id="regUser" class="input" placeholder="4位数字ID">
<input id="regNick" class="input" placeholder="昵称">
<input id="regPass" class="input" type="password" placeholder="密码">
<button class="btn" style="width:100%" onclick="fakeRegister()">注 册</button>
<p style="margin-top:14px;text-align:center;font-size:13px;color:var(--muted);cursor:pointer" onclick="showLogin()">已有账号？立即登录</p>
</div>
</div>
</div>

<div id="mainApp" class="hidden">
<div class="nav">
<button class="nav-btn active" onclick="showPage('home')">🏠 控制台</button>
<button class="nav-btn" onclick="showPage('events')">📅 连飞活动</button>
<button class="nav-btn" onclick="showPage('chat')">💬 塔台通讯</button>
<button class="nav-btn" onclick="showPage('weather')">🌤 气象情报</button>
<button class="nav-btn" onclick="showPage('honors')">🎖 荣誉墙</button>
<button class="nav-btn" onclick="showPage('rank')">🏆 排行榜</button>
</div>
<div id="home" class="page">
<div class="card"><h3>欢迎，测试飞行员</h3><p>这是纯前端兜底版本</p></div>
</div>
<div id="events" class="page hidden"><div class="card"><p>连飞活动（模拟）</p></div></div>
<div id="chat" class="page hidden"><div class="card"><p>塔台通讯（模拟）</p></div></div>
<div id="weather" class="page hidden"><div class="card"><p>气象情报（模拟）</p></div></div>
<div id="honors" class="page hidden"><div class="card"><p>荣誉墙（模拟）</p></div></div>
<div id="rank" class="page hidden"><div class="card"><p>排行榜（模拟）</p></div></div>
</div>
</div>

<script>
const fakeLogin=()=>{alert("✅ 登录按钮已生效（纯前端模式）");document.getElementById("authOverlay").classList.add("hidden");document.getElementById("mainApp").classList.remove("hidden")};
const fakeRegister=()=>alert("✅ 注册按钮已生效（纯前端模式）");
const showRegister=()=>{document.getElementById("loginBox").classList.add("hidden");document.getElementById("registerBox").classList.remove("hidden")};
const showLogin=()=>{document.getElementById("registerBox").classList.add("hidden");document.getElementById("loginBox").classList.remove("hidden")};
const showPage=id=>{document.querySelectorAll(".page").forEach(p=>p.classList.add("hidden"));document.getElementById(id).classList.remove("hidden");document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));document.querySelector(`.nav-btn[onclick="showPage('${id}')"]`)?.classList.add("active")};
</script>
</body>
</html>
