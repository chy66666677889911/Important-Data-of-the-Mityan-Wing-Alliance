<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>弥天翼航空联盟</title>
<style>
:root{--bg:#0b1120;--card:#131a2c;--border:#1e293b;--primary:#3b82f6;--green:#22d3ee;--text:#f1f5f9;--muted:#94a3b8;--danger:#ef4444}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:1100px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px}
.input{width:100%;padding:10px;margin-bottom:12px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,0.05);color:var(--text)}
.btn{background:linear-gradient(90deg,var(--primary),var(--green));color:#0b1120;padding:10px 16px;border:none;border-radius:8px;font-weight:600;cursor:pointer}
.btn:hover{opacity:.9}
.btn-danger{background:var(--danger)}
.hidden{display:none!important}
.flex{display:flex;gap:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:9999}
.modal-box{background:var(--card);padding:24px;width:400px;border-radius:12px;border:1px solid var(--border)}
.nav{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto}
.nav-btn{padding:8px 16px;border-radius:9999px;background:var(--card);border:1px solid var(--border);color:var(--muted);cursor:pointer;white-space:nowrap}
.nav-btn.active{background:var(--primary);color:#0b1120;border-color:var(--primary)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.stat{text-align:center;padding:16px;background:rgba(59,130,246,0.1);border-radius:10px}
.stat-num{font-size:24px;font-weight:bold;color:var(--primary)}
.stat-label{font-size:12px;color:var(--muted)}
#chatBox{height:300px;overflow:auto;background:rgba(0,0,0,0.2);padding:12px;border-radius:8px;margin-bottom:12px;border:1px solid var(--border)}
.chat-msg{margin-bottom:8px;font-size:14px}
.chat-nick{color:var(--green);font-weight:bold}
</style>
</head>
<body>
<div class="container">
<div id="authOverlay" class="modal">
<div class="modal-box">
<h2 style="color:var(--green);margin-bottom:16px;text-align:center">✈️ 弥天翼航空联盟</h2>
<div id="loginBox">
<input id="loginUser" class="input" placeholder="4位数字ID">
<input id="loginPass" class="input" type="password" placeholder="密码">
<label style="display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:13px;color:var(--muted)">
<input type="checkbox" id="rememberMe"> 记住我（30天内自动登录）
</label>
<button class="btn" style="width:100%" onclick="login()">登 录</button>
<p style="margin-top:14px;text-align:center;font-size:13px;color:var(--muted);cursor:pointer" onclick="showRegister()">没有账号？立即注册</p>
</div>
<div id="registerBox" class="hidden">
<input id="regUser" class="input" placeholder="4位数字ID">
<input id="regNick" class="input" placeholder="昵称">
<input id="regPass" class="input" type="password" placeholder="密码">
<button class="btn" style="width:100%" onclick="register()">注 册</button>
<p style="margin-top:14px;text-align:center;font-size:13px;color:var(--muted);cursor:pointer" onclick="showLogin()">已有账号？立即登录</p>
</div>
</div>
</div>

<div id="mainApp" class="hidden">
<div class="nav">
<button class="nav-btn active" onclick="showPage('home')">🏠 控制台</button>
<button class="nav-btn" onclick="showPage('events')">📅 连飞活动</button>
<button class="nav-btn" onclick="showPage('chat')">💬 塔台通讯</button>
<button class="nav-btn" onclick="showPage('weather')">🌤 气象情报</button>
<button class="nav-btn" onclick="showPage('honors')">🎖 荣誉墙</button>
<button class="nav-btn" onclick="showPage('rank')">🏆 排行榜</button>
<button class="nav-btn" onclick="showPage('admin')" id="adminBtn" style="display:none">🛡 联盟管理</button>
<button class="nav-btn btn-danger" onclick="logout()" id="logoutBtn" style="display:none">退出登录</button>
</div>

<div id="home" class="page">
<div class="stats">
<div class="stat"><div class="stat-num" id="statUsers">-</div><div class="stat-label">注册用户</div></div>
<div class="stat"><div class="stat-num" id="statEvents">-</div><div class="stat-label">活动总数</div></div>
<div class="stat"><div class="stat-num" id="statSignups">-</div><div class="stat-label">报名人次</div></div>
<div class="stat"><div class="stat-num" id="statPoints">0</div><div class="stat-label">我的积分</div></div>
</div>
<div class="card">
<h3 style="margin-bottom:12px">欢迎，<span id="nickname">-</span></h3>
<button class="btn" onclick="checkin()">📌 每日签到</button>
</div>
</div>

<div id="events" class="page hidden">
<div class="card">
<h3 style="margin-bottom:12px">连飞活动</h3>
<div id="eventList"></div>
<button class="btn" style="margin-top:16px" onclick="showPage('createEvent')">发布新活动</button>
</div>
</div>

<div id="createEvent" class="page hidden">
<div class="card">
<h3 style="margin-bottom:12px">发布活动</h3>
<input id="evTitle" class="input" placeholder="活动标题">
<textarea id="evDesc" class="input" placeholder="活动说明" rows="4"></textarea>
<button class="btn" onclick="createEvent()">发布活动</button>
</div>
</div>

<div id="chat" class="page hidden">
<div class="card">
<h3 style="margin-bottom:12px">塔台实时通讯</h3>
<div id="chatBox"></div>
<div class="flex">
<input id="chatInput" class="input" placeholder="输入通讯内容">
<button class="btn" onclick="sendChat()">发送</button>
</div>
</div>
</div>

<div id="weather" class="page hidden">
<div class="card">
<h3 style="margin-bottom:12px">机场气象情报</h3>
<div class="flex">
<input id="icao" class="input" placeholder="ICAO代码 (如 ZBAA)">
<button class="btn" onclick="queryWeather()">查询</button>
</div>
<pre id="weatherResult" style="margin-top:16px;white-space:pre-wrap;font-size:13px;color:var(--muted)"></pre>
</div>
</div>

<div id="honors" class="page hidden">
<div class="card">
<h3 style="margin-bottom:12px">荣誉墙</h3>
<div id="honorList"></div>
<div id="addHonorBox" class="hidden" style="margin-top:20px">
<input id="honorTitle" class="input" placeholder="荣誉标题">
<textarea id="honorDesc" class="input" placeholder="荣誉说明" rows="3"></textarea>
<button class="btn" onclick="addHonor()">添加荣誉</button>
</div>
</div>
</div>

<div id="rank" class="page hidden">
<div class="card">
<h3 style="margin-bottom:12px">积分排行榜</h3>
<div id="rankList"></div>
</div>
</div>

<div id="admin" class="page hidden">
<div class="card">
<h3 style="margin-bottom:12px">封禁用户</h3>
<input id="banId" class="input" placeholder="目标用户4位ID">
<button class="btn btn-danger" onclick="banUser()">封禁账号</button>
</div>
</div>
</div>

<div id="signupModal" class="modal hidden">
<div class="modal-box">
<h3 style="margin-bottom:12px">活动报名</h3>
<input id="callsign" class="input" placeholder="呼号">
<input id="aircraft" class="input" placeholder="机型">
<input id="parking" class="input" placeholder="停机位">
<button class="btn" onclick="submitSignup()">提交报名</button>
<button class="btn btn-danger" onclick="closeSignup()" style="margin-top:8px">取消</button>
</div>
</div>
</div>

<script>
let user=null,currentEventId=null;

const login=async()=>{
const username=document.getElementById("loginUser").value.trim();
const password=document.getElementById("loginPass").value;
const remember=document.getElementById("rememberMe").checked;
if(!/^\d{4}$/.test(username)){alert("账号必须是4位数字");return}
if(!password){alert("请输入密码");return}
try{
const res=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,password})});
const d=await res.json();
if(!d.ok){alert(d.msg);return}
user=d.user;
if(remember){localStorage.setItem("mt_user",JSON.stringify(user))}else{sessionStorage.setItem("mt_user",JSON.stringify(user))}
location.reload();
}catch{alert("登录请求失败")}
};

const register=async()=>{
const username=document.getElementById("regUser").value.trim();
const nickname=document.getElementById("regNick").value.trim();
const password=document.getElementById("regPass").value;
if(!/^\d{4}$/.test(username)){alert("账号必须是4位数字");return}
if(!nickname||!password){alert("请填写完整信息");return}
const res=await fetch("/api/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,nickname,password})});
const d=await res.json();
alert(d.msg);
if(d.ok)showLogin();
};

const doLogin=()=>{
document.getElementById("authOverlay").classList.add("hidden");
document.getElementById("mainApp").classList.remove("hidden");
document.getElementById("nickname").innerText=user.nickname;
document.getElementById("statPoints").innerText=user.points;
if(user.is_admin){
document.getElementById("adminBtn").style.display="inline-block";
document.getElementById("logoutBtn").style.display="inline-block";
document.getElementById("addHonorBox").style.display="block";
}
loadStats();
loadEvents();
loadHonors();
loadRank();
};

window.onload=()=>{
const u=localStorage.getItem("mt_user")||sessionStorage.getItem("mt_user");
if(u){try{user=JSON.parse(u);doLogin();}catch{localStorage.clear();sessionStorage.clear()}}
};

const showRegister=()=>{document.getElementById("loginBox").classList.add("hidden");document.getElementById("registerBox").classList.remove("hidden")};
const showLogin=()=>{document.getElementById("registerBox").classList.add("hidden");document.getElementById("loginBox").classList.remove("hidden")};
const logout=()=>{localStorage.clear();sessionStorage.clear();location.reload()};
const showPage=id=>{
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById(id).classList.add("active");
document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
document.querySelector(`.nav-btn[onclick="showPage('${id}')"]`)?.classList.add("active");
};
const checkin=async()=>{const d=await(await fetch("/api/checkin",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({userId:user.id})})).json();alert(d.msg)};
