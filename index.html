<script>
let user = null, currentEventId = null;

/* ===== 登录 ===== */
const login = async () => {
  const username = document.getElementById("loginUser").value.trim();
  const password = document.getElementById("loginPass").value;
  const remember = document.getElementById("rememberMe").checked;
  if (!/^\d{4}$/.test(username)) { alert("账号必须是4位数字"); return; }
  if (!password) { alert("请输入密码"); return; }
  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });
    const d = await res.json();
    if (!d.ok) { alert(d.msg); return; }
    user = d.user;
    if (remember) localStorage.setItem("mt_user", JSON.stringify(user));
    else sessionStorage.setItem("mt_user", JSON.stringify(user));
    location.reload();
  } catch {
    alert("登录请求失败");
  }
};

/* ===== 注册 ===== */
const register = async () => {
  const username = document.getElementById("regUser").value.trim();
  const nickname = document.getElementById("regNick").value.trim();
  const password = document.getElementById("regPass").value;
  if (!/^\d{4}$/.test(username)) { alert("账号必须是4位数字"); return; }
  if (!nickname || !password) { alert("请填写完整信息"); return; }
  const res = await fetch("/api/register", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username, nickname, password })
  });
  const d = await res.json();
  alert(d.msg);
  if (d.ok) showLogin();
};

/* ===== 登录后初始化 ===== */
const doLogin = () => {
  document.getElementById("authOverlay").classList.add("hidden");
  document.getElementById("mainApp").classList.remove("hidden");
  document.getElementById("nickname").innerText = user.nickname;
  document.getElementById("statPoints").innerText = user.points;
  if (user.is_admin) {
    document.getElementById("adminBtn").style.display = "inline-block";
    document.getElementById("logoutBtn").style.display = "inline-block";
    document.getElementById("addHonorBox").style.display = "block";
  }
  loadStats();
  loadEvents();
  loadHonors();
  loadRank();
};

window.onload = () => {
  const u = localStorage.getItem("mt_user") || sessionStorage.getItem("mt_user");
  if (u) {
    try {
      user = JSON.parse(u);
      doLogin();
    } catch {
      localStorage.clear();
      sessionStorage.clear();
    }
  }
};

/* ===== 页面切换 ===== */
const showRegister = () => {
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("registerBox").classList.remove("hidden");
};
const showLogin = () => {
  document.getElementById("registerBox").classList.add("hidden");
  document.getElementById("loginBox").classList.remove("hidden");
};
const logout = () => {
  localStorage.clear();
  sessionStorage.clear();
  location.reload();
};
const showPage = id => {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
  document.querySelector(`.nav-btn[onclick="showPage('${id}')"]`)?.classList.add("active");
};

/* ===== 签到 ===== */
const checkin = async () => {
  const d = await (await fetch("/api/checkin", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ userId: user.id })
  })).json();
  alert(d.msg);
};

/* ===== 统计 ===== */
const loadStats = async () => {
  const d = await (await fetch("/api/stats")).json();
  document.getElementById("statUsers").innerText = d.users;
  document.getElementById("statEvents").innerText = d.events;
  document.getElementById("statSignups").innerText = d.signups;
};

/* ===== 活动 ===== */
const loadEvents = async () => {
  const list = await (await fetch("/api/events/list")).json();
  document.getElementById("eventList").innerHTML = list.length
    ? list.map(e => `
        <div style="margin-bottom:12px">
          <b>${e.title}</b>
          <p style="color:var(--muted);font-size:13px">${e.description}</p>
          <button class="btn" onclick="openSignup(${e.id})">报名</button>
        </div>`).join("")
    : "暂无活动";
};

const openSignup = id => {
  currentEventId = id;
  document.getElementById("signupModal").classList.remove("hidden");
};
const closeSignup = () => document.getElementById("signupModal").classList.add("hidden");

const submitSignup = async () => {
  await fetch("/api/event-signup", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      eventId: currentEventId,
      userId: user.id,
      callsign: callsign.value,
      aircraft: aircraft.value,
      parking: parking.value
    })
  });
  alert("报名成功");
  closeSignup();
};

const createEvent = async () => {
  await fetch("/api/events", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      title: evTitle.value,
      description: evDesc.value,
      userId: user.id
    })
  });
  alert("活动已发布");
  loadEvents();
  showPage("events");
};

/* ===== 气象 ===== */
const queryWeather = async () => {
  const d = await (await fetch("/api/weather?icao=" + icao.value)).json();
  document.getElementById("weatherResult").innerText = d.metar + "\n\n" + d.taf;
};

/* ===== 聊天 ===== */
const sendChat = async () => {
  await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ nickname: user.nickname, message: chatInput.value })
  });
  chatInput.value = "";
  loadChat();
};
const loadChat = async () => {
  const list = await (await fetch("/api/chat")).json();
  document.getElementById("chatBox").innerHTML = list.reverse().map(m =>
    `<div class="chat-msg"><span class="chat-nick">${m.nickname}</span>: ${m.message}</div>`
  ).join("");
};

/* ===== 荣誉 ===== */
const loadHonors = async () => {
  const list = await (await fetch("/api/honors")).json();
  document.getElementById("honorList").innerHTML = list.map(h =>
    `<div style="margin-bottom:10px"><b>${h.title}</b><p style="color:var(--muted);font-size:13px">${h.description}</p></div>`
  ).join("");
};
const addHonor = async () => {
  await fetch("/api/honors", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      title: honorTitle.value,
      description: honorDesc.value,
      userId: user.id
    })
  });
  alert("荣誉添加成功");
  loadHonors();
};

/* ===== 排行榜 ===== */
const loadRank = async () => {
  const list = await (await fetch("/api/rank")).json();
  document.getElementById("rankList").innerHTML = list.map((r, i) =>
    `<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid var(--border)">
      <span>${i + 1}. ${r.nickname}</span><span>${r.points} 分</span>
    </div>`
  ).join("");
};

/* ===== 封禁 ===== */
const banUser = async () => {
  const d = await (await fetch("/api/admin/ban", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      targetUserId: banId.value,
      adminId: user.id
    })
  })).json();
  alert(d.msg);
};
</script>
