<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>弥天翼联盟</title>
<style>
:root{
  --bg:#0b1120;--card:#131b2e;--accent:#3b82f6;
  --green:#22d3ee;--text:#e2e8f0;--muted:#94a3b8;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
body{background:var(--bg);color:var(--text);height:100vh;display:flex;align-items:center;justify-content:center}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:9999}
.auth-box{background:var(--card);padding:36px 32px;border-radius:10px;width:340px;border:1px solid #1e293b}
.auth-box h2{color:var(--green);text-align:center;margin-bottom:20px;font-size:22px}
.input{width:100%;padding:10px;margin-bottom:12px;background:var(--bg);border:1px solid #334155;color:var(--text);border-radius:6px;font-size:14px}
.btn{width:100%;padding:10px;background:var(--accent);color:#0b1120;border:none;border-radius:6px;font-weight:bold;cursor:pointer;font-size:15px}
.btn:active{transform:scale(.98)}
.check{font-size:13px;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.link{color:var(--accent);font-size:13px;text-align:center;cursor:pointer;margin-top:14px}
.hidden{display:none!important}
.main{display:none;padding:40px;width:100%;max-width:900px}
.main h1{color:var(--green);margin-bottom:10px}
.main p{color:var(--muted)}
</style>
</head>
<body>

<div id="authOverlay" class="overlay">
  <div class="auth-box">
    <div id="loginBox">
      <h2>✈️ 弥天翼联盟</h2>
      <input id="loginUser" class="input" placeholder="4位数字ID" maxlength="4">
      <input id="loginPass" class="input" type="password" placeholder="密码">
      <label class="check"><input type="checkbox" id="remember"> 记住我</label>
      <button class="btn" onclick="login()">登 录</button>
      <div class="link" onclick="toggleAuth()">没有账号？立即注册</div>
    </div>

    <div id="registerBox" class="hidden">
      <h2>📝 加入联盟</h2>
      <input id="regUser" class="input" placeholder="4位数字ID" maxlength="4">
      <input id="regNick" class="input" placeholder="飞行员呼号">
      <input id="regPass" class="input" type="password" placeholder="密码">
      <button class="btn" onclick="register()">注 册</button>
      <div class="link" onclick="toggleAuth()">已有账号？返回登录</div>
    </div>
  </div>
</div>

<div id="mainApp" class="main">
  <h1>弥天翼联盟 · 控制中心</h1>
  <p>欢迎回来，<span id="nickname"></span>。当前积分：<span id="points"></span></p>
  <button class="btn" style="width:auto;margin-top:20px" onclick="logout()">退出登录</button>
</div>

<script>
let user=null;

const toggleAuth=()=>{
  document.getElementById('loginBox').classList.toggle('hidden');
  document.getElementById('registerBox').classList.toggle('hidden');
};

const login=async()=>{
  const u=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPass').value;
  const r=document.getElementById('remember').checked;

  if(!/^\d{4}$/.test(u)) return alert('账号必须为4位数字ID');
  if(!p) return alert('请输入密码');

  try{
    const res=await fetch('/api/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:u,password:p})
    });
    const d=await res.json();
    if(!d.ok) return alert(d.msg);
    user=d.user;
    if(r) localStorage.setItem('mt_user',JSON.stringify(user));
    doLogin();
  }catch{
    alert('登录失败，请检查后端接口');
  }
};

const register=async()=>{
  const u=document.getElementById('regUser').value.trim();
  const n=document.getElementById('regNick').value.trim();
  const p=document.getElementById('regPass').value;

  if(!/^\d{4}$/.test(u)) return alert('账号必须为4位数字ID');
  if(!n||!p) return alert('请填写完整信息');

  try{
    const res=await fetch('/api/register',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:u,nickname:n,password:p})
    });
    const d=await res.json();
    alert(d.msg);
    if(d.ok) toggleAuth();
  }catch{
    alert('注册失败');
  }
};

const doLogin=()=>{
  document.getElementById('authOverlay').classList.add('hidden');
  document.getElementById('mainApp').style.display='block';
  document.getElementById('nickname').innerText=user.nickname;
  document.getElementById('points').innerText=user.points;
};

const logout=()=>{
  localStorage.clear();
  location.reload();
};

window.onload=()=>{
  const u=localStorage.getItem('mt_user');
  if(u){user=JSON.parse(u);doLogin();}
};
</script>
</body>
</html>
