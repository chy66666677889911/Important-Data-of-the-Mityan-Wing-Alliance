wPage('rankPage', this)">🏆 排行榜</button>    <button class="menu-btn" onclick="showPage('chatPage', this)">💬 塔台通讯</button>    <button class="menu-btn" onclick="showPage('weatherPage', this)">🌤 气象情报</button>    <button class="menu-btn" onclick="showPage('eventPage', this)">📅 连飞活动</button>    <button class="menu-btn" onclick="showPage('honorPage', this)">🎖 荣誉墙</button>  </div>  <div class="main">    <div class="header">      弥天翼联盟控制台      <div id="authArea"><button onclick="toggleAuth()">🔑 登录/注册</button></div>      <div id="userArea" class="hidden"> <button onclick="logout()">退出</button></div>    </div>    <div class="content">            <div id="homePage" class="page active"><div class="card">欢迎来到弥天翼联盟这里是专业的航空模拟飞行与连飞活动平台。</div></div>            <div id="rankPage" class="page"><div class="card">🏆 飞行员排行榜<div id="rankList">加载中...</div></div></div>            <div id="chatPage" class="page"><div class="card">💬 塔台通讯室<div id="chatBox" style="height:200px;overflow-y:auto;background:#000;padding:10px;margin-bottom:10px;"></div><div class="flex"><input id="chatInput" placeholder="输入消息..."><button onclick="sendChat()">发送</button></div></div></div>            <div id="weatherPage" class="page"><div class="card">🌤 METAR/TAF 查询<div class="flex"><input id="icaoInput" placeholder="ICAO代码 (如 ZBAA)"><button onclick="queryWeather()">获取情报</button></div><div id="weatherResult" style="background:#000;padding:10px;margin-top:10px;"></div></div></div>            <div id="eventPage" class="page"><div class="card">📅 连飞活动<input id="evTitle" placeholder="活动标题"><textarea id="evDesc" placeholder="活动描述"></textarea><button onclick="createEvent()">发布活动</button></div><div class="card" id="eventList">加载中...</div></div>            <div id="honorPage" class="page"><div class="card">🎖 添加荣誉<input id="hoTitle" placeholder="奖项名称"><input id="hoImg" placeholder="图片URL"><textarea id="hoDesc" placeholder="奖项描述"></textarea><button onclick="addHonor()">添加荣誉</button></div><div class="card" id="honorList">加载中...</d
