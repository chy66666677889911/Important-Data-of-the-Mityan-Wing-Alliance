<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>弥天翼航空联盟</title>
<style>
:root{--bg:#ffffff;--primary:#1e90ff;--green:#2ecc71}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:#333;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh}
input{padding:12px;margin:10px 0;width:100%;border:1px solid #ddd;border-radius:10px;font-size:16px}
button{padding:12px;width:100%;border:none;border-radius:10px;font-size:15px;font-weight:600;background:var(--primary);color:#fff;cursor:pointer}
button.secondary{background:#888}
.container{display:none;padding:70px 16px 60px}
.container.active{display:block}
.topbar{position:fixed;top:0;left:0;right:0;height:56px;background:#f8f9fa;display:flex;align-items:center;padding:0 16px;box-shadow:0 2px 6px rgba(0,0,0,.08);z-index:100}
.topbar button{width:auto;background:none;color:#333;font-size:22px}
.menu{position:absolute;top:56px;left:0;background:#fff;padding:12px;display:none;flex-direction:column;gap:8px;box-shadow:0 4px 10px rgba(0,0,0,.1)}
.menu.show{display:flex}
.userinfo{margin-left:auto;font-size:14px}
footer{position:fixed;bottom:0;left:0;right:0;text-align:center;padding:12px;background:var(--green);color:#fff;font-weight:600}
.card{background:#f4f6f8;padding:16px;border-radius:14px;margin:12px 0}
@media(min-width:768px){.container{max-width:720px;margin:auto}}
</style>
</head>
<body>

<!-- 顶部 -->
<div class="topbar">
  <button onclick="menu.classList.toggle('show')">☰</button>
  <div class="menu" id="menu">
    <button onclick="nav('main')">主界面</button>
    <button onclick="nav('event')">连飞活动</button>
    <button onclick="nav('honor')">荣誉墙</button>
    <button onclick="nav('chat')">聊天室</button>
    <button onclick="logout()">退出</button>
  </div>
  <div class="userinfo" id="userinfo"></div>
</div>

<!-- 登录 -->
<div class="container active" id="loginPage">
  <h2>弥天翼航空联盟</h2>
  <input id="loginUser" placeholder="4位数字ID">
  <input id="loginPass" type="password" placeholder="密码">
  <label><input type="checkbox" id="remember"> 记住我</label>
  <button onclick="login()">登录</button>
  <button class="secondary" onclick="nav('register')">注册</button>
</div>

<!-- 注册 -->
<div class="container" id="registerPage">
  <h2>注册</h2>
  <input id="regUser" placeholder="4位数字ID">
  <input id="regPass" type="password" placeholder="密码">
  <input id="regEmail" placeholder="邮箱">
  <button onclick="register()">提交</button>
  <button class="secondary" onclick="nav('login')">返回</button>
</div>

<!-- 主界面 -->
<div class="container" id="mainPage">
  <div class="card">
    <h3>连飞活动</h3>
    <button onclick="nav('event')">查看活动</button>
  </div>
  <div class="card">
    <h3>荣誉墙</h3>
    <button onclick="nav('honor')">查看荣誉</button>
  </div>
</div>

<!-- 连飞活动 -->
<div class="container" id="eventPage">
  <h2>连飞活动</h2>
  <div id="eventList"></div>
</div>

<!-- 荣誉墙 -->
<div class="container" id="honorPage">
  <h2>荣誉墙</h2>
  <div id="honorList"></div>
</div>

<footer>弥天翼航空联盟</footer>

<script>
let user=null;

const nav=id=>{
  document.querySelectorAll('.container').forEach(c=>c.classList.remove('active'));
  document.getElementById(id+'Page').classList.add('active');
};

const login=()=>{
  if(!/^\d{4}$/.test(loginUser.value)) return alert('账号必须为4位数字ID');
  fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:loginUser.value,password:loginPass.value})})
  .then(r=>r.json()).then(d=>{
    if(!d.ok) return alert(d.msg);
    user=d.user;
    if(remember.checked) localStorage.setItem('mt_user',JSON.stringify(user));
    initUser();
    nav('main');
  });
};

const register=()=>{
  if(!/^\d{4}$/.test(regUser.value)) return alert('账号必须为4位数字ID');
  fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:regUser.value,password:regPass.value,email:regEmail.value})})
  .then(r=>r.json()).then(d=>{alert(d.msg);if(d.ok)nav('login')});
};

const logout=()=>{localStorage.clear();location.reload();};

const initUser=()=>{
  userinfo.innerText=`欢迎, ${user.nickname}`;
  fetch('https://ipapi.co/json').then(r=>r.json()).then(d=>{
    userinfo.innerText+=` 🌤 ${d.city}`;
  });
};

if(localStorage.getItem('mt_user')){
  user=JSON.parse(localStorage.getItem('mt_user'));
  initUser();nav('main');
}
</script>
</body>
</html>
