<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>弥天翼航空联盟</title>
<style>
:root{
  --bg:#0b1120;--sidebar:#0f172a;--card:#131b2e;
  --accent:#3b82f6;--green:#22d3ee;--text:#e2e8f0;--muted:#94a3b8;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex}
.sidebar{width:220px;background:var(--sidebar);padding:24px 16px;border-right:1px solid #1e293b}
.sidebar h1{color:var(--green);font-size:20px;margin-bottom:32px}
.sidebar button{width:100%;background:none;border:1px solid #334155;color:var(--text);padding:10px 12px;border-radius:6px;margin-bottom:10px;cursor:pointer;text-align:left;font-size:14px}
.sidebar button:hover,.sidebar button.active{background:var(--accent);color:#0b1120;border-color:var(--accent)}
.main{flex:1;display:flex;flex-direction:column}
.header{height:56px;background:var(--card);border-bottom:1px solid #1e293b;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.header span{color:var(--green);font-weight:500}
.content{flex:1;padding:24px;overflow-y:auto}
.card{background:var(--card);border:1px solid #1e293b;border-radius:10px;padding:20px;margin-bottom:20px}
.card h3{color:var(--green);margin-bottom:12px}
.input,textarea{width:100%;padding:10px;background:var(--bg);border:1px solid #334155;color:var(--text);border-radius:6px;margin-bottom:12px}
.btn{background:linear-gradient(90deg,var(--accent),var(--green));color:#0b1120;padding:10px 16px;border:none;border-radius:6px;font-weight:600;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:9999}
.modal-box{background:var(--card);padding:24px;width:520px;border-radius:10px;border:1px solid #334155}
.hidden{display:none!important}
.page{display:none}
.page.active{display:block}
.admin-only{display:none}
</style>
</head>
<body>

<div id="authOverlay" class="modal">
  <div class="modal-box">
    <h3>✈️ 弥天翼航空联盟</h3>
    <input id="loginUser" class="input" placeholder="4位数字ID">
    <input id="loginPass" class="input" type="password" placeholder="密码">
    <button class="btn" onclick="login()">登 录</button>
  </div>
</div>

<div class="main hidden" id="mainApp">
  <div class="sidebar">
    <h1>弥天翼</h1>
    <button onclick="showPage('home')" class="active">🏠 控制台</button>
    <button onclick="showPage('events')">📅 连飞活动</button>
    <button class="admin-only" onclick="showPage('admin')">🛡 联盟管理</button>
  </div>

  <div class="content">
    <div class="header">
      <span>弥天翼航空联盟</span>
      <span id="headerUser"></span>
    </div>

    <div id="home" class="page active">
      <div class="card">
        <h3>欢迎，<span id="nickname"></span></h3>
        <p>积分：<span id="points"></span></p>
        <button class="btn" onclick="logout()">退出登录</button>
      </div>
    </div>

    <div id="events" class="page">
      <div class="card">
        <h3>连飞活动</h3>
        <div id="eventList">加载中...</div>
      </div>
    </div>

    <div id="admin" class="page">
      <div class="card">
        <h3>发布连飞活动</h3>
        <input id="evTitle" class="input" placeholder="活动标题">
        <textarea id="evDesc" class="input" placeholder="活动说明"></textarea>
        <button class="btn" onclick="createEvent()">发布活动</button>
      </div>
    </div>
  </div>
</div>

<div id="signupModal" class="modal hidden">
  <div class="modal-box">
    <h3>活动报名</h3>
    <input id="callsign" class="input" placeholder="呼号">
    <input id="aircraft" class="input" placeholder="机型">
    <input id="parking" class="input" placeholder="停机位">
    <button class="btn" onclick="submitSignup()">提交报名</button>
    <button class="btn" style="background:#555;margin-top:10px" onclick="closeSignup()">取消</button>
  </div>
</div>

<script>
let user=null,currentEventId=null;

const login=async()=>{
  const d=await fetch("/api/login",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      username:loginUser.value.trim(),
      password:loginPass.value
    })
  }).then(r=>r.json());
  if(!d.ok)return alert(d.msg);
  user=d.user;
  doLogin();
};

const doLogin=()=>{
  authOverlay.classList.add("hidden");
  mainApp.classList.remove("hidden");
  headerUser.innerText="👤 "+user.nickname;
  nickname.innerText=user.nickname;
  points.innerText=user.points;
  if(user.is_admin)document.querySelectorAll(".admin-only").forEach(e=>e.style.display="block");
  loadEvents();
};

const loadEvents=async()=>{
  const list=await fetch("/api/events/list").then(r=>r.json());
  eventList.innerHTML=list.length?list.map(e=>`
    <div style="margin-bottom:12px">
      <b>${e.title}</b>
      <p style="color:var(--muted);font-size:13px">${e.description}</p>
      <button class="btn" onclick="openSignup(${e.id})">报名参加</button>
    </div>
  `).join(""):"暂无活动";
};

const createEvent=async()=>{
  await fetch("/api/events",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      title:evTitle.value,
      description:evDesc.value,
      userId:user.id
    })
  });
  alert("活动已发布");
  loadEvents();
};

const openSignup=id=>{
  currentEventId=id;
  signupModal.classList.remove("hidden");
};
const closeSignup=()=>signupModal.classList.add("hidden");

const submitSignup=async()=>{
  await fetch("/api/event-signup",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      eventId:currentEventId,
      userId:user.id,
      callsign:callsign.value,
      aircraft:aircraft.value,
      parking:parking.value
    })
  });
  alert("报名成功");
  closeSignup();
};

const showPage=(id)=>{
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
};

const logout=()=>{localStorage.clear();location.reload();};

window.onload=()=>{
  const u=localStorage.getItem("mt_user");
  if(u){user=JSON.parse(u);doLogin();}
};
</script>
</body>
</html>
