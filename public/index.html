<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>弥天翼航空联盟</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
}
.container{
  width:100%;
  max-width:420px;
}
.box{
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-radius:20px;
  padding:28px 24px;
  box-shadow:0 20px 40px rgba(0,0,0,0.25);
  color:#fff;
  animation:fadeIn .6s ease;
}
@keyframes fadeIn{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}
h2{text-align:center;font-weight:600;margin-bottom:24px;letter-spacing:1px}
input{
  width:100%;
  padding:14px 16px;
  margin:12px 0;
  border:none;
  border-radius:12px;
  font-size:16px;
  background:rgba(255,255,255,0.9);
  color:#333;
  outline:none;
}
input:focus{box-shadow:0 0 0 3px rgba(30,144,255,.5)}
button{
  width:100%;
  padding:14px;
  margin-top:14px;
  border:none;
  border-radius:12px;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  background:linear-gradient(135deg,#1e90ff,#00bfff);
  color:#fff;
  transition:all .2s ease;
  box-shadow:0 6px 20px rgba(30,144,255,.35);
}
button:active{transform:scale(0.97)}
button.secondary{
  background:rgba(255,255,255,0.25);
  box-shadow:none;
}
button.secondary:active{background:rgba(255,255,255,0.35)}
.hidden{display:none}

.rank-item{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid rgba(255,255,255,0.15);
  font-size:15px;
}

.chat-bubble{
  margin:8px 0;
  padding:10px 14px;
  border-radius:16px;
  max-width:80%;
  word-break:break-word;
  font-size:14px;
}
.self{
  background:linear-gradient(135deg,#1e90ff,#00bfff);
  color:#fff;
  margin-left:auto;
}
.other{
  background:rgba(255,255,255,0.25);
  color:#fff;
}
#chatBox{flex:1;overflow:auto;padding:10px 0}

code{background:rgba(0,0,0,0.25);padding:6px 8px;border-radius:8px;display:block;margin-top:6px}
</style>
</head>
<body>

<!-- 登录 -->
<div class="container" id="loginPage">
  <div class="box">
    <h2>弥天翼航空联盟</h2>
    <input id="loginUser" placeholder="账号">
    <input id="loginPass" type="password" placeholder="密码">
    <button onclick="login()">登录</button>
    <button class="secondary" onclick="show('registerPage')">注册账号</button>
  </div>
</div>

<!-- 注册 -->
<div class="container hidden" id="registerPage">
  <div class="box">
    <h2>注册</h2>
    <input id="regUser" placeholder="账号">
    <input id="regPass" type="password" placeholder="密码">
    <input id="regEmail" placeholder="邮箱">
    <button onclick="register()">提交注册</button>
    <button class="secondary" onclick="show('loginPage')">返回登录</button>
  </div>
</div>

<!-- 主面板 -->
<div class="container hidden" id="mainPage">
  <div class="box">
    <h2 id="welcome"></h2>
    <p>积分：<span id="points"></span></p>
    <button onclick="checkin()">每日签到</button>
    <button onclick="loadRank()">排行榜</button>
    <button onclick="loadChat();show('chatPage')">聊天室</button>
    <button onclick="show('weatherPage')">🌍 全球机场天气</button>
    <div id="rankList" style="margin-top:15px"></div>
  </div>
</div>

<!-- 聊天室 -->
<div class="container hidden" id="chatPage">
  <div class="box" style="height:90vh;display:flex;flex-direction:column">
    <div id="chatBox"></div>
    <div style="display:flex;gap:8px">
      <input id="chatInput" placeholder="输入消息">
      <button onclick="sendChat()" style="width:auto;padding:0 16px">发送</button>
    </div>
    <button class="secondary" onclick="show('mainPage')">返回</button>
  </div>
</div>

<!-- 全球机场天气 -->
<div class="container hidden" id="weatherPage">
  <div class="box">
    <h2>全球机场天气</h2>
    <input id="icaoInput" placeholder="输入ICAO代码，如 ZGGG / RJTT / KJFK">
    <button onclick="queryWeather()">查询 METAR / TAF</button>
    <button class="secondary" onclick="show('mainPage')">返回</button>
    <div id="weatherResult" style="margin-top:15px;font-size:14px;line-height:1.6"></div>
  </div>
</div>

<script>
let user = null;

const show = id =>
  document.querySelectorAll('.container').forEach(c => c.classList.add('hidden')) ||
  document.getElementById(id).classList.remove('hidden');

/* 注册 */
const register = () =>
  fetch('/api/register', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      username:regUser.value,
      password:regPass.value,
      email:regEmail.value
    })
  })
  .then(r => r.json())
  .then(d => {
    alert(d.msg || '注册成功');
    if(d.ok) show('loginPage');
  })
  .catch(() => alert('注册失败'));

/* 登录 */
const login = () =>
  fetch('/api/login', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      username:loginUser.value,
      password:loginPass.value
    })
  })
  .then(r => r.json())
  .then(d => {
    if(!d.ok) return alert(d.msg);
    user = d.user;
    welcome.innerText = '欢迎, ' + user.nickname;
    points.innerText = user.points;
    show('mainPage');
  })
  .catch(() => alert('登录失败'));

/* 签到 */
const checkin = () =>
  fetch('/api/checkin', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({userId:user.id})
  })
  .then(r => r.json())
  .then(d => alert(d.ok ? '签到成功 +10 积分' : d.msg))
  .catch(() => alert('签到失败'));

/* 排行榜 */
const loadRank = () =>
  fetch('/api/rank')
    .then(r => r.json())
    .then(data =>
      rankList.innerHTML = data.map((u,i) =>
        `<div class="rank-item"><span>${i+1}. ${u.nickname}</span><span>${u.points}</span></div>`
      ).join('')
    )
    .catch(() => rankList.innerHTML = '加载失败');

/* 聊天室 */
const loadChat = () =>
  fetch('/api/chat')
    .then(r => r.json())
    .then(data =>
      chatBox.innerHTML = data.map(d =>
        `<div class="chat-bubble ${d.nickname===user.nickname?'self':'other'}">
          <b>${d.nickname}</b><br>${d.message}
        </div>`
      ).join('')
    );

const sendChat = () => {
  fetch('/api/chat', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      userId:user.id,
      username:user.username,
      nickname:user.nickname,
      message:chatInput.value
    })
  })
  .then(() => { chatInput.value=''; loadChat(); })
  .catch(() => alert('发送失败'));
};

/* 全球机场天气 */
const queryWeather = () => {
  const icao = icaoInput.value.trim().toUpperCase();
  if(!icao) return alert('请输入ICAO代码');
  weatherResult.innerHTML = '查询中...';
  fetch('/api/weather?icao=' + icao)
    .then(r => r.json())
    .then(d => {
      if(!d.ok) return weatherResult.innerHTML = '❌ ' + d.msg;
      weatherResult.innerHTML = `
        <p><b>机场：</b>${d.icao}</p>
        <p><b>飞行类别：</b>${d.flightCat || '未知'}</p>
        <p><b>METAR：</b><code>${d.metar || '无数据'}</code></p>
        <p><b>TAF：</b><code>${d.taf || '无数据'}</code></p>
      `;
    })
    .catch(() => weatherResult.innerHTML = '查询失败');
};
</script>
</body>
</html>
