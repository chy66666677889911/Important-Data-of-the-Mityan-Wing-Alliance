<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>弥天翼航空联盟</title>
<style>
:root{--bg:#0b1120;--card:#131a2c;--border:#1e293b;--primary:#3b82f6;--text:#f1f5f9;--muted:#94a3b8}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:800px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px}
.input{width:100%;padding:10px;margin-bottom:12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text)}
.btn{background:var(--primary);color:#fff;border:none;padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{opacity:.9}
.btn-danger{background:#ef4444}
.hidden{display:none!important}
.flex{display:flex;gap:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:9999}
.modal-box{background:var(--card);padding:24px;width:360px;border-radius:10px;border:1px solid var(--border)}
.nav{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto}
.nav-btn{padding:8px 16px;border-radius:9999px;background:var(--card);border:1px solid var(--border);color:var(--muted);cursor:pointer}
.nav-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
#chatBox{height:260px;overflow:auto;background:var(--bg);padding:12px;border-radius:8px;margin-bottom:12px;border:1px solid var(--border)}
.chat-msg{margin-bottom:8px;font-size:14px}
.chat-nick{color:var(--primary);font-weight:bold}
</style>
</head>
<body>
<div class="container">
<div id="authOverlay" class="modal">
<div class="modal-box">
<h2 style="color:var(--primary);margin-bottom:16px">✈️ 弥天翼航空联盟</h2>
<div id="loginBox">
<input id="loginUser" class="input" placeholder="4位数字ID">
<input id="loginPass" class="input" type="password" placeholder="密码">
<label style="font-size:13px;color:var(--muted);display:flex;align-items:center;margin-bottom:12px">
<input type="checkbox" id="rememberMe" style="margin-right:6px"> 记住我（30天内自动登录）
</label>
<button class="btn" onclick="login()">登 录</button>
<p style="margin-top:14px;font-size:13px;color:var(--muted);cursor:pointer" onclick="showRegister()">没有账号？立即注册</p>
</div>
<div id="registerBox" class="hidden">
<input id="regUser" class="input" placeholder="4位数字ID">
<input id="regNick" class="input" placeholder="昵称">
<input id="regPass" class="input" type="password" placeholder="密码">
<button class="btn" onclick="register()">注 册</button>
<p style="margin-top:14px;font-size:13px;color:var(--muted);cursor:pointer" onclick="showLogin()">已有账号？立即登录</p>
</div>
</div>
</div>

<div id="mainApp" class="hidden">
<div class="nav">
<button class="nav-btn active" onclick="showPage('home')">首页</button>
<button class="nav-btn" onclick="showPage('weather')">气象</button>
<button class="nav-btn" onclick="showPage('chat')">塔台通讯</button>
<button class="nav-btn" onclick="showPage('events')">活动</button>
<button class="nav-btn" onclick="showPage('admin')" id="adminBtn" style="display:none">管理</button>
<button class="nav-btn btn-danger" onclick="logout()" id="logoutBtn" style="display:none">退出</button>
</div>

<div id="home" class="page">
<div class="card">
<h3>欢迎，<span id="nickname">-</span></h3>
<p>积分：<span id="points">0</span></p>
</div>
</div>

<div id="weather" class="page hidden">
<div class="card">
<h3>气象情报</h3>
<div class="flex">
<input id="icao" class="input" placeholder="ICAO代码 (如 ZBAA)">
<button class="btn" onclick="queryWeather()">查询</button>
</div>
<pre id="weatherResult" style="margin-top:10px"></pre>
</div>
</div>

<div id="chat" class="page hidden">
<div class="card">
<h3>塔台通讯</h3>
<div id="chatBox"></div>
<div class="flex">
<input id="chatInput" class="input" placeholder="输入通讯内容">
<button class="btn" onclick="sendChat()">发送</button>
</div>
</div>
</div>

<div id="events" class="page hidden">
<div class="card">
<h3>连飞活动</h3>
<div id="eventList">加载中...</div>
</div>
</div>

<div id="admin" class="page hidden">
<div class="card">
<h3>发布活动</h3>
<input id="evTitle" class="input" placeholder="活动标题">
<textarea id="evDesc" class="input" placeholder="活动说明"></textarea>
<button class="btn" onclick="createEvent()">发布</button>
<hr style="margin:20px 0;border:none;border-top:1px solid var(--border)">
<h3 style="color:#ef4444">封禁用户</h3>
<input id="banId" class="input" placeholder="目标用户4位ID">
<button class="btn btn-danger" onclick="banUser()">封禁</button>
</div>
</div>
</div>
</div>

<script>
let user=null,currentEventId=null;

const login=async()=>{
const username=document.getElementById("loginUser").value.trim();
const password=document.getElementById("loginPass").value;
const remember=document.getElementById("rememberMe").checked;
if(!/^\d{4}$/.test(username)){alert("账号必须是4位数字");return}
if(!password){alert("请输入密码");return}
try{
const res=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,password})});
const d=await res.json();
if(!d.ok){alert(d.msg);return}
user=d.user;
if(remember){localStorage.setItem("mt_user",JSON.stringify(user))}else{sessionStorage.setItem("mt_user",JSON.stringify(user))}
location.reload();
}catch{alert("登录请求失败")}
};

const register=async()=>{
const username=document.getElementById("regUser").value.trim();
const nickname=document.getElementById("regNick").value.trim();
const password=document.getElementById("regPass").value;
if(!/^\d{4}$/.test(username)){alert("账号必须是4位数字");return}
if(!nickname||!password){alert("请填写完整信息");return}
const res=await fetch("/api/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,nickname,password})});
const d=await res.json();
alert(d.msg);
if(d.ok)showLogin();
};

const doLogin=()=>{
document.getElementById("authOverlay").classList.add("hidden");
document.getElementById("mainApp").classList.remove("hidden");
document.getElementById("nickname").innerText=user.nickname;
document.getElementById("points").innerText=user.points;
if(user.is_admin){
document.getElementById("adminBtn").style.display="inline-block";
document.getElementById("logoutBtn").style.display="inline-block";
}
loadEvents();
};

window.onload=()=>{
const u=localStorage.getItem("mt_user")||sessionStorage.getItem("mt_user");
if(u){user=JSON.parse(u);doLogin();}
};

const showRegister=()=>{document.getElementById("loginBox").classList.add("hidden");document.getElementById("registerBox").classList.remove("hidden")};
const showLogin=()=>{document.getElementById("registerBox").classList.add("hidden");document.getElementById("loginBox").classList.remove("hidden")};
const logout=()=>{localStorage.clear();sessionStorage.clear();location.reload()};
const showPage=id=>{document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));document.querySelector(`.nav-btn[onclick="showPage('${id}')"]`)?.classList.add("active")};

const loadEvents=async()=>{
const list=await(await fetch("/api/events/list")).json();
document.getElementById("eventList").innerHTML=list.length?list.map(e=>`<div style="margin-bottom:12px"><b>${e.title}</b><p style="color:var(--muted);font-size:13px">${e.description}</p><button class="btn" onclick="openSignup(${e.id})">报名</button></div>`).join(""):"暂无活动";
};

const openSignup=id=>{currentEventId=id;document.getElementById("signupModal").classList.remove("hidden")};
const closeSignup=()=>document.getElementById("signupModal").classList.add("hidden");

const submitSignup=async()=>{
await fetch("/api/event-signup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({eventId:currentEventId,userId:user.id,callsign:callsign.value,aircraft:aircraft.value,parking:parking.value})});
alert("报名成功");closeSignup();
};

const queryWeather=async()=>{
const d=await(await fetch("/api/weather?icao="+icao.value)).json();
document.getElementById("weatherResult").innerText=d.metar+"\n"+d.taf;
};

const sendChat=async()=>{
await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({nickname:user.nickname,message:chatInput.value})});
chatInput.value="";
};

const banUser=async()=>{
const d=await(await fetch("/api/admin/ban",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({targetUserId:banId.value,adminId:user.id})})).json();
alert(d.msg);
};

const createEvent=async()=>{
await fetch("/api/events",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title:evTitle.value,description:evDesc.value,userId:user.id})});
alert("活动已发布");
loadEvents();
showPage("events");
};
</script>
</body>
</html>
