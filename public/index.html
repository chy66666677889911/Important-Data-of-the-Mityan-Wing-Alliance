<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>弥天翼航空联盟</title>
<style>
:root{
  --bg:#0b1120;--card:#131b2e;--accent:#3b82f6;
  --green:#22d3ee;--text:#e2e8f0;--muted:#94a3b8;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:9999}
.auth-box{background:var(--card);padding:36px 32px;border-radius:10px;width:340px;border:1px solid #1e293b}
.auth-box h2{color:var(--green);text-align:center;margin-bottom:20px;font-size:22px}
.input{width:100%;padding:10px;margin-bottom:12px;background:var(--bg);border:1px solid #334155;color:var(--text);border-radius:6px;font-size:14px}
.btn{width:100%;padding:10px;background:var(--accent);color:#0b1120;border:none;border-radius:6px;font-weight:bold;cursor:pointer;font-size:15px}
.btn:active{transform:scale(.98)}
.check{font-size:13px;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.link{color:var(--accent);font-size:13px;text-align:center;cursor:pointer;margin-top:14px}
.hidden{display:none!important}
.main{display:none;padding:20px;max-width:1100px;margin:0 auto}
.sidebar{position:fixed;left:0;top:0;width:200px;height:100vh;background:var(--card);padding:20px;border-right:1px solid #1e293b}
.sidebar h2{color:var(--green);font-size:18px;margin-bottom:30px}
.sidebar button{width:100%;background:none;border:1px solid #334155;color:var(--text);padding:10px;border-radius:6px;margin-bottom:10px;cursor:pointer}
.sidebar button:hover{background:var(--accent);color:#0b1120}
.content{margin-left:220px;padding-top:20px}
.card{background:var(--card);padding:20px;border-radius:10px;margin-bottom:20px;border:1px solid #1e293b}
.card h3{margin-bottom:10px;color:var(--green)}
input,textarea{width:100%;padding:10px;margin-bottom:10px;background:var(--bg);border:1px solid #334155;color:var(--text);border-radius:6px}
.chat-box{height:200px;overflow-y:auto;background:#0b1120;padding:10px;margin-bottom:10px}
.chat-box div{padding:4px 0;border-bottom:1px solid #1e293b}
@media(max-width:768px){.sidebar{display:none}.content{margin-left:0}}
</style>
</head>
<body>

<!-- 登录/注册 -->
<div id="authOverlay" class="overlay">
  <div class="auth-box">
    <div id="loginBox">
      <h2>✈️ 弥天翼联盟</h2>
      <input id="loginUser" class="input" placeholder="4位数字ID">
      <input id="loginPass" class="input" type="password" placeholder="密码">
      <label class="check"><input type="checkbox" id="remember"> 记住我</label>
      <button class="btn" onclick="login()">登 录</button>
      <div class="link" onclick="toggleAuth()">没有账号？注册</div>
    </div>
    <div id="registerBox" class="hidden">
      <h2>📝 加入联盟</h2>
      <input id="regUser" class="input" placeholder="4位数字ID">
      <input id="regNick" class="input" placeholder="飞行员呼号">
      <input id="regPass" class="input" type="password" placeholder="密码">
      <button class="btn" onclick="register()">注 册</button>
      <div class="link" onclick="toggleAuth()">已有账号？登录</div>
    </div>
  </div>
</div>

<!-- 主界面 -->
<div class="main" id="mainApp">
  <div class="sidebar">
    <h2>弥天翼</h2>
    <button onclick="showPage('home')">🏠 首页</button>
    <button onclick="showPage('events')">📅 连飞活动</button>
    <button onclick="showPage('chat')">💬 塔台通讯</button>
    <button onclick="showPage('weather')">🌤 气象情报</button>
    <button onclick="showPage('honors')">🎖 荣誉墙</button>
    <button onclick="showPage('rank')">🏆 排行榜</button>
    <button onclick="checkin()">📌 每日签到</button>
  </div>

  <div class="content">
    <div id="home" class="page">
      <div class="card">
        <h3>欢迎，<span id="nickname"></span></h3>
        <p>积分：<span id="points"></span></p>
        <button class="btn" onclick="logout()">退出登录</button>
      </div>
    </div>

    <div id="events" class="page hidden">
      <div class="card">
        <h3>连飞活动</h3>
        <input id="evTitle" placeholder="活动标题">
        <textarea id="evDesc" placeholder="活动描述"></textarea>
        <button class="btn" onclick="createEvent()">发布活动</button>
        <div id="eventList"></div>
      </div>
    </div>

    <div id="chat" class="page hidden">
      <div class="card">
        <h3>塔台通讯</h3>
        <div class="chat-box" id="chatBox"></div>
        <input id="chatInput" placeholder="输入消息">
        <button class="btn" onclick="sendChat()">发送</button>
      </div>
    </div>

    <div id="weather" class="page hidden">
      <div class="card">
        <h3>气象情报</h3>
        <input id="icao" placeholder="ICAO 机场代码">
        <button class="btn" onclick="queryWeather()">查询</button>
        <pre id="weatherResult"></pre>
      </div>
    </div>

    <div id="honors" class="page hidden">
      <div class="card">
        <h3>荣誉墙</h3>
        <input id="honorTitle" placeholder="荣誉名称">
        <textarea id="honorDesc" placeholder="荣誉说明"></textarea>
        <button class="btn" onclick="addHonor()">添加荣誉</button>
        <div id="honorList"></div>
      </div>
    </div>

    <div id="rank" class="page hidden">
      <div class="card">
        <h3>排行榜</h3>
        <div id="rankList"></div>
      </div>
    </div>
  </div>
</div>

<script>
let user=null;
const api=async(url,body)=>fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json());

const toggleAuth=()=>{
  loginBox.classList.toggle('hidden');
  registerBox.classList.toggle('hidden');
};

const login=async()=>{
  const u=loginUser.value.trim(),p=loginPass.value;
  if(!/^\d{4}$/.test(u))return alert('4位数字ID');
  const d=await api('/api/login',{username:u,password:p});
  if(!d.ok)return alert(d.msg);
  user=d.user;
  if(remember.checked)localStorage.setItem('mt_user',JSON.stringify(user));
  doLogin();
};

const register=async()=>{
  const d=await api('/api/register',{
    username:regUser.value.trim(),
    nickname:regNick.value.trim(),
    password:regPass.value
  });
  alert(d.msg);
  if(d.ok)toggleAuth();
};

const doLogin=()=>{
  authOverlay.classList.add('hidden');
  mainApp.style.display='block';
  nickname.innerText=user.nickname;
  points.innerText=user.points;
  loadRank();
};

const logout=()=>{localStorage.clear();location.reload();};

const showPage=(id)=>{
  document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
};

const checkin=async()=>{
  const d=await api('/api/checkin',{userId:user.id});
  alert(d.msg);
};

const sendChat=async()=>{
  await api('/api/chat',{nickname:user.nickname,message:chatInput.value});
  chatInput.value='';loadChat();
};

const loadChat=async()=>{
  const d=await(await fetch('/api/chat')).json();
  chatBox.innerHTML=d.map(c=>`<div><b>${c.nickname}:</b> ${c.message}</div>`).join('');
};

const queryWeather=async()=>{
  const d=await(await fetch('/api/weather?icao='+icao.value)).json();
  weatherResult.innerText=d.metar+'\n'+d.taf;
};

const createEvent=async()=>{
  await api('/api/events',{title:evTitle.value,description:evDesc.value,userId:user.id});
  alert('发布成功');
};

const addHonor=async()=>{
  await api('/api/honors',{title:honorTitle.value,description:honorDesc.value,userId:user.id});
  alert('添加成功');
};

const loadRank=async()=>{
  const d=await(await fetch('/api/rank')).json();
  rankList.innerHTML=d.map(u=>`<div>${u.nickname} - ${u.points} 分</div>`).join('');
};

window.onload=()=>{
  const u=localStorage.getItem('mt_user');
  if(u){user=JSON.parse(u);doLogin();}
};
</script>
</body>
</html>
