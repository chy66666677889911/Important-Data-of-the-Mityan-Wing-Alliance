<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>弥天翼航空联盟</title>
<style>
:root{
  --bg:#0b1120;--sidebar:#0f172a;--card:#131b2e;
  --accent:#3b82f6;--green:#22d3ee;--text:#e2e8f0;--muted:#94a3b8;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex}
.sidebar{width:220px;background:var(--sidebar);padding:24px 16px;border-right:1px solid #1e293b}
.sidebar h1{color:var(--green);font-size:20px;margin-bottom:32px}
.sidebar button{width:100%;background:none;border:1px solid #334155;color:var(--text);padding:10px 12px;border-radius:6px;margin-bottom:10px;cursor:pointer;text-align:left;font-size:14px}
.sidebar button:hover,.sidebar button.active{background:var(--accent);color:#0b1120;border-color:var(--accent)}
.main{flex:1;display:flex;flex-direction:column}
.header{height:56px;background:var(--card);border-bottom:1px solid #1e293b;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.header span{color:var(--green);font-weight:500}
.content{flex:1;padding:24px;overflow-y:auto}
.card{background:var(--card);border:1px solid #1e293b;border-radius:10px;padding:20px;margin-bottom:20px}
.card h3{color:var(--green);margin-bottom:12px;font-size:16px}
.input,textarea{width:100%;padding:10px;background:var(--bg);border:1px solid #334155;color:var(--text);border-radius:6px;margin-bottom:12px}
.btn{background:linear-gradient(90deg,var(--accent),var(--green));color:#0b1120;padding:10px 16px;border:none;border-radius:6px;font-weight:600;cursor:pointer}
.hidden{display:none!important}
.page{display:none}
.page.active{display:block}
.admin-only{display:none}
</style>
</head>
<body>

<div id="authOverlay" class="overlay">
  <div class="card" style="width:360px">
    <h3>✈️ 弥天翼航空联盟</h3>
    <input id="loginUser" class="input" placeholder="4位数字ID">
    <input id="loginPass" class="input" type="password" placeholder="密码">
    <label style="font-size:13px;color:var(--muted);display:flex;gap:6px">
      <input type="checkbox" id="remember"> 记住我
    </label>
    <button class="btn" onclick="login()">登 录</button>
  </div>
</div>

<div class="main hidden" id="mainApp">
  <div class="sidebar">
    <h1>弥天翼</h1>
    <button onclick="showPage('home')" class="active">🏠 控制台</button>
    <button onclick="showPage('events')">📅 连飞活动</button>
    <button onclick="showPage('chat')">💬 塔台通讯</button>
    <button onclick="showPage('weather')">🌤 气象情报</button>
    <button onclick="showPage('honors')">🎖 荣誉墙</button>
    <button onclick="showPage('rank')">🏆 排行榜</button>
    <button onclick="checkin()">📌 每日签到</button>
    <button class="admin-only" onclick="showPage('admin')">🛡 联盟管理</button>
  </div>

  <div class="content">
    <div class="header">
      <span>弥天翼航空联盟</span>
      <span id="headerUser"></span>
    </div>

    <div id="home" class="page active">
      <div class="card">
        <h3>欢迎回来，<span id="nickname"></span></h3>
        <p>积分：<b id="points"></b></p>
        <p id="localWeather" style="margin-top:10px;color:var(--green)"></p>
        <button class="btn" onclick="logout()">退出登录</button>
      </div>
    </div>

    <div id="admin" class="page">
      <div class="card">
        <h3>联盟管理</h3>
        <p>仅管理员可见</p>
      </div>
    </div>
  </div>
</div>

<script>
let user=null;

const login=async()=>{
  const u=loginUser.value.trim(),p=loginPass.value;
  if(!/^\d{4}$/.test(u))return alert("4位数字ID");
  const d=await fetch("/api/login",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({username:u,password:p})
  }).then(r=>r.json());

  if(!d.ok)return alert(d.msg);
  user=d.user;
  if(remember.checked)localStorage.setItem("mt_user",JSON.stringify(user));
  doLogin();
};

const doLogin=()=>{
  authOverlay.classList.add("hidden");
  mainApp.classList.remove("hidden");
  headerUser.innerText="👤 "+user.nickname;
  nickname.innerText=user.nickname;
  points.innerText=user.points;

  if(user.is_admin){
    document.querySelectorAll(".admin-only").forEach(e=>e.style.display="block");
  }

  // ✅ 获取当前地区天气
  navigator.geolocation.getCurrentPosition(async pos=>{
    const r=await fetch(`/api/weather-geo?lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`).then(r=>r.json());
    if(r.ok) localWeather.innerText=`📍 ${r.city} 当前气温 ${r.temperature}`;
  });
};

const showPage=(id)=>{
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
};

const logout=()=>{localStorage.clear();location.reload();};

window.onload=()=>{
  const u=localStorage.getItem("mt_user");
  if(u){user=JSON.parse(u);doLogin();}
};
</script>
</body>
</html>
